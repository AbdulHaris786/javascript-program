
<!DOCTYPE html>
<html>

    <title>count the number

    </title>
</head>
<body>
<h2 id="number">10</h2>
<button onclick="count()">Count</button>
    <script>
   let num = 10;

 function count() {
 num = num + 1;
   document.getElementById("number").innerHTML = num;   }
   
   </script>
