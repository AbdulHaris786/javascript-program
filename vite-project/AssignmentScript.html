
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Count the Number</title>
</head>
<body>
    <h2 id="number">10</h2>
    <button onclick="count()">Count</button>

    <script>
        let num = 10;

        function count() {
            num += 1;
            document.getElementById("number").textContent = num;
        }
    </script>
</body>
</html>
